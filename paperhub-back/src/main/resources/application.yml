server:
  port: ${PAPERHUB_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: paperhub-back
  datasource:
    url: ${PAPERHUB_DB_URL:jdbc:mysql://127.0.0.1:3306/paperhub?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai}
    username: ${PAPERHUB_DB_USERNAME:paperhub}
    password: ${PAPERHUB_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
      connection-init-sql: "SET time_zone = '+08:00'"
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 102MB

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

paperhub:
  storage:
    root: ${PAPERHUB_STORAGE_ROOT:./data/storage}
    cleanup-enabled: ${PAPERHUB_CLEANUP_ENABLED:true}
  security:
    jwt-secret: ${PAPERHUB_JWT_SECRET:}
    token-ttl: 24h
    allowed-origins: ${PAPERHUB_ALLOWED_ORIGINS:}
    login:
      window: 1m
      per-ip: 20
      per-account: 10
      max-entries: 10000
    registration:
      window: 1m
      per-ip: 5
      max-entries: 10000
